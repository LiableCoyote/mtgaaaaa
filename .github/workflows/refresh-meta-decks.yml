name: Refresh meta decks

# Rebuilds data/meta-decks.json from Archidekt, keeping only currently-legal
# Arena maindecks that resolve against data/cards.json. Runs weekly, or on demand.
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch meta decks
        run: node scripts/fetch-meta-decks.mjs --per=12 --scan=90

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/meta-decks.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/meta-decks.json
            git commit -m "chore: refresh meta decks from Archidekt"
            git push
          else
            echo "No changes to meta-decks.json."
          fi
